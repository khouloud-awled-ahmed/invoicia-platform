services:
  mongodb:
    image: mongo:7
    container_name: invocia-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - invocia-network
  backend:
    build: ./backend
    container_name: invocia-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DB_URI=mongodb://mongodb:27017/INVOCIA-TN
      - MONGODB_URI=mongodb://mongodb:27017/INVOCIA-TN
      - PORT=3001
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
    depends_on:
      - mongodb
    networks:
      - invocia-network
  frontend:
    build: .
    container_name: invocia-frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - invocia-network
volumes:
  mongodb_data:
networks:
  invocia-network:
    driver: bridge
